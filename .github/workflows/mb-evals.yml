# mb-evals (base-owned; SPEC section 15.4). Live evals on Claude Code and Codex.
# Triggers: manual dispatch and nightly on the default branch. There is deliberately NO pull_request
# trigger (so no secret is ever exposed to a PR-triggered run) and never pull_request_target. To
# evaluate a PR, run this workflow from the Actions tab on the PR branch with "changed-only" set:
# it evaluates only the plugins changed against the default branch.
# A host whose API key secret is missing emits ::notice::skipped and does not fail.
# Results are uploaded only after the leak scan (CHK-20 patterns) ran over them.
name: mb-evals

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Plugins to evaluate (space separated; empty = all)'
        required: false
        default: ''
      changed-only:
        description: 'Only plugins changed against the default branch (use on a PR branch)'
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: mb-evals-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: 2.1.325
  CODEX_VERSION: 0.164.0 # the version every Codex fact in docs/base/hosts.md was verified on

jobs:
  evals:
    strategy:
      fail-fast: false
      matrix:
        host: [claude, codex]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Select plugins
        id: select
        env:
          CHANGED_ONLY: ${{ inputs.changed-only }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PLUGINS: ${{ inputs.plugins }}
        run: |
          # Names only: anything but [a-z0-9-] and spaces is dropped.
          plugins=$(printf '%s' "$INPUT_PLUGINS" | tr -c 'a-z0-9 \n-' ' ')
          if [ "$CHANGED_ONLY" = "true" ]; then
            plugins=$(git diff --name-only "origin/${DEFAULT_BRANCH}...HEAD" \
              | sed -n -E 's#^(examples/)?plugins/([a-z0-9][a-z0-9-]*)/.*#\2#p' | sort -u | tr '\n' ' ')
            if [ -z "$plugins" ]; then echo "no plugin changed"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "plugins: ${plugins:-all}"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Check the API key
        id: key
        if: steps.select.outputs.skip != 'true'
        env:
          HOST: ${{ matrix.host }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "$HOST" = "claude" ]; then key="$ANTHROPIC_API_KEY"; name=ANTHROPIC_API_KEY; else key="$OPENAI_API_KEY"; name=OPENAI_API_KEY; fi
          if [ -z "$key" ]; then
            echo "::notice::skipped: $HOST evals ($name is not set)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the host CLIs
        if: steps.key.outputs.run == 'true'
        env:
          HOST: ${{ matrix.host }}
        run: |
          # claude is always installed: it is the llm judge for both hosts.
          npm i -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          if [ "$HOST" = "codex" ]; then npm i -g "@openai/codex@${CODEX_VERSION}"; fi
      - name: ./mb eval
        if: steps.key.outputs.run == 'true'
        env:
          HOST: ${{ matrix.host }}
          PLUGINS: ${{ steps.select.outputs.plugins }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # shellcheck disable=SC2086 # PLUGINS is a sanitised, space-separated list of names
          ./mb eval $PLUGINS --host "$HOST"
      - name: Private leak denylist (optional secret, never printed)
        if: always() && steps.key.outputs.run == 'true'
        env:
          DENYLIST: ${{ secrets.MB_LEAK_DENYLIST }}
        run: |
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/mb-leak-denylist.txt"
            echo "MB_LEAK_DENYLIST=$RUNNER_TEMP/mb-leak-denylist.txt" >> "$GITHUB_ENV"
          fi
      - name: Leak scan of the eval results (CHK-20)
        id: scan
        if: always() && steps.key.outputs.run == 'true'
        run: |
          # dist/ is gitignored, so `mb check` does not see it: run the CHK-20 rule over dist/evals.
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          const { run } = await import(pathToFileURL(path.resolve("tools/lib/rules/CHK-20.mjs")).href);
          // Paths stay repo-relative (dist/evals/...), so the home-path patterns apply too.
          const root = process.cwd();
          if (!fs.existsSync("dist/evals")) { console.log("no dist/evals"); process.exit(0); }
          const files = fs.readdirSync("dist/evals", { recursive: true })
            .map((f) => `dist/evals/${f.split(path.sep).join("/")}`)
            .filter((f) => fs.statSync(path.join(root, f)).isFile());
          const rctx = {
            root, env: process.env, git: false, files,
            abs: (r) => path.join(root, r),
            exists: (r) => fs.existsSync(path.join(root, r)),
            tracked: () => false,
            readBytes: (r) => fs.readFileSync(path.join(root, r)),
          };
          const found = await run(rctx);
          for (const f of found) console.log(`::error::CHK-20 ${f.path}: ${f.message}`);
          console.log(`scanned ${files.length} file(s), ${found.length} finding(s)`);
          process.exit(found.length ? 1 : 0);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outcome == 'success'
        with:
          name: evals-${{ matrix.host }}
          path: dist/evals/
          if-no-files-found: ignore
