# mb-base-update (base-owned). Weekly base update, enabled only when the
# repository variable MB_BASE_UPDATE is 'true'. Fetched base code never runs next to a write token:
#   gate     no checkout, no code: says whether secrets.MB_UPDATE_TOKEN is set (a boolean only)
#   update   contents: read, no secrets: runs ./mb base-update and uploads the diff
#   publish  runs no code from the fetched base (only git apply, git push and gh)
# With MB_UPDATE_TOKEN (PAT/App token: contents, pull-requests, workflows write) publish opens the PR
# with that token, so pull_request checks run. Without it, publish pushes the branch with
# GITHUB_TOKEN and writes the compare link + checklist to the job summary; it never opens the PR
# (GITHUB_TOKEN events do not start pull_request workflows), and update runs with --no-workflows
# because GITHUB_TOKEN cannot push .github/workflows changes.
# It runs on the default branch only (a manual run from another branch is skipped), so the update is
# built from, and the PR targets, the default branch.
name: mb-base-update

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mb-base-update
  cancel-in-progress: false

jobs:
  gate:
    if: vars.MB_BASE_UPDATE == 'true' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has-token: ${{ steps.t.outputs.has-token }}
    steps:
      - id: t
        env:
          HAS_TOKEN: ${{ secrets.MB_UPDATE_TOKEN != '' }}
        run: echo "has-token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

  update:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: ./mb base-update
        env:
          HAS_TOKEN: ${{ needs.gate.outputs.has-token }}
        run: |
          git config user.name "mb-base-update"
          git config user.email "mb-base-update@users.noreply.github.com"
          flags=(--keep)
          if [ "$HAS_TOKEN" != "true" ]; then flags+=(--no-workflows); fi
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          ./mb base-update "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/out/report.txt"
          code=${PIPESTATUS[0]}
          set -e
          # --keep: conflicts are reported instead of exit 6. Exit 1 after the update report means the
          # update was applied but gen/check is red (e.g. CHK-16 for kept conflicts): still publish it,
          # so the PR shows the red check. Any other failure stops here.
          if [ "$code" -eq 1 ] && grep -q '^base-update report: ' "$RUNNER_TEMP/out/report.txt"; then
            echo "::warning::update applied, but ./mb check is red (see the report); the PR will show it"
          elif [ "$code" -ne 0 ]; then
            echo "::error::./mb base-update exited $code"; exit "$code"
          fi
      - name: Build the diff
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary > "$RUNNER_TEMP/out/base-update.patch"
          node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(".mb-lock.json","utf8")).base.tag)' > "$RUNNER_TEMP/out/tag.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: base-update
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  publish:
    needs: [gate, update]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.MB_UPDATE_TOKEN || github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-update
          path: ${{ runner.temp }}/in
      - name: Apply, push, and open the PR or print the compare link
        env:
          HAS_TOKEN: ${{ needs.gate.outputs.has-token }}
          GH_TOKEN: ${{ secrets.MB_UPDATE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          IN: ${{ runner.temp }}/in
        run: |
          # The patch and tag come from a job that ran fetched code: treat them as untrusted data.
          tag=$(head -c 64 "$IN/tag.txt")
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected base tag in the update artifact"; exit 1
          fi
          branch="mb/base-update-$tag"
          DEFAULT_BRANCH=$(git rev-parse --abbrev-ref HEAD) # the gate admits only default-branch runs, so HEAD is the default branch
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::notice::branch $branch already exists (its PR is open or was closed); nothing pushed. Delete the branch to rebuild it on the next run"
            exit 0
          fi
          git config user.name "mb-base-update"
          git config user.email "mb-base-update@users.noreply.github.com"
          git switch -c "$branch"
          git apply --index "$IN/base-update.patch"
          git -c core.hooksPath=/dev/null commit -q -m "chore: marketplace-base update to $tag"
          git push origin "HEAD:refs/heads/$branch"
          body="$IN/body.md"
          {
            echo "Automated marketplace-base update to \`$tag\`."
            echo
            echo '```'
            tail -n 60 "$IN/report.txt"
            echo '```'
            echo
            echo "Checklist:"
            echo "- [ ] Review conflicts listed above (kept files keep CHK-16 red until resolved)."
            echo "- [ ] \`mb-check\` is green."
          } > "$body"
          if [ "$HAS_TOKEN" = "true" ]; then
            gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$branch" \
              --title "marketplace-base update to $tag" --body-file "$body"
          else
            {
              echo "## marketplace-base $tag is on branch \`$branch\`"
              echo
              echo "Open the PR: $SERVER/$REPO/compare/$DEFAULT_BRANCH...$branch?expand=1"
              echo
              echo "Checklist:"
              echo "- [ ] Open the PR with the link above (this job never opens it: GITHUB_TOKEN events do not start pull_request checks)."
              echo "- [ ] Run \`./mb base-update\` locally for \`.github/workflows/mb-*.yml\` (skipped here: GITHUB_TOKEN cannot push workflow files), or set the MB_UPDATE_TOKEN secret."
              echo "- [ ] Resolve any conflicts listed in the report (CHK-16 stays red until then)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
